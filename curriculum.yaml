      title: Operating System Fundamentals
      order: 1
      prerequisites:
      - computer-architecture
      concepts:
      - Kernel
      - User space
      - System calls
      - Interrupts
      - Filesystems
    - id: processes-threads
      title: Processes and Threads
      order: 2
      prerequisites:
      - os-fundamentals
      concepts:
      - Process address spaces
      - Threads
      - Scheduling
      - Context switching
    - id: memory-management
      title: Memory Management
      order: 3
      prerequisites:
      - os-fundamentals
      concepts:
