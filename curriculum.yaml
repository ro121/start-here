      title: IP Addressing
      order: 1
      prerequisites:
      - tcp-ip
      concepts:
      - IP
      - IPv4
      - IPv6
      - Public and private addresses
      - DHCP
      note: 04-networking/ip-addressing.md
      related:
      - ethernet
      - network-security
    - id: subnetting
      title: Subnetting
      order: 2
      prerequisites:
      - ip-addressing
      concepts:
      - CIDR
      - Prefixes
      - Subnet boundaries
      - IPv4 and IPv6 allocation
      note: 04-networking/subnetting.md
      related:
      - ip-addressing
      - aws-vpc
    - id: routing
      title: Routing
      order: 3
      prerequisites:
      - subnetting
      - ethernet
      concepts:
      - Route lookup
      - Longest-prefix match
      - Default gateways
      - Route tables
    - id: nat
      title: NAT
      order: 4
      prerequisites:
      - routing
      - tcp
      concepts:
      - Source NAT
      - Destination NAT
      - Connection tracking
      - Port translation
  - id: network-protocols-subject
    title: Transport and Application Protocols
    order: 3
    topics:
    - id: tcp
      title: TCP
      order: 1
      prerequisites:
      - ip-addressing
      concepts:
      - Ports
      - Three-way handshake
      - Sequence numbers
      - Retransmission
      - Flow and congestion control
    - id: udp
      title: UDP
      order: 2
      prerequisites:
      - ip-addressing
      concepts:
      - Datagrams
      - Ports
      - Loss
      - Application-managed reliability
    - id: dns
      title: DNS
      order: 3
      prerequisites:
      - udp
      - tcp
      concepts:
      - Zones
      - Records
      - Recursive resolution
      - Authoritative servers
      - Caching
      - TTL
      related:
      - http
      - kubernetes-networking
      - aws-traffic
      note: 04-networking/dns.md
    - id: http
      title: HTTP
      order: 4
      prerequisites:
      - tcp
      - dns
      concepts:
      - Methods
      - Status codes
      - Headers
      - Caching semantics
      - HTTPS
      - Connection reuse
    - id: tls
      title: TLS
      order: 5
      prerequisites:
      - tcp
      - pki
      concepts:
      - Handshake
      - Certificates
      - Peer verification
      - Transport encryption
      related:
      - http
  - id: traffic-management-subject
    title: Traffic Management and Diagnosis
    order: 4
    topics:
