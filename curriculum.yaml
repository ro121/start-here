      - os-fundamentals
      concepts:
      - Files
      - Directories
      - Inodes
      - Mounts
      - Paths
      - Package management
    - id: linux-users-permissions
      title: Linux Users and Permissions
      order: 2
      prerequisites:
      - linux-filesystem
      - identity-access
      concepts:
      - Users
      - Groups
      - Ownership
      - Mode bits
      - sudo
      - ACLs
      implements:
      - identity-access
    - id: linux-shell
      title: Linux Shell
      order: 3
      prerequisites:
      - linux-filesystem
      - programming-fundamentals
      concepts:
      - Shell
      - Bash
      - Environment variables
      - Pipes
      - Redirection
      - Exit codes
