  purpose: Build the vocabulary and reasoning skills used throughout computing.
  prerequisites: []
  subjects:
  - id: computing-literacy-subject
    title: Computing Literacy
    order: 1
    topics:
    - id: computer-fundamentals
      title: Computer Fundamentals
      order: 1
