      concepts:
      - Hardware and software
      - Input and output
      - Binary
      - Bits and bytes
      - Units and encodings
  - id: programming-basics-subject
    title: Programming Basics
    order: 2
    topics:
    - id: programming-fundamentals
      title: Programming Fundamentals
      order: 1
      prerequisites:
      - computer-fundamentals
      concepts:
