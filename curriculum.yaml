      - Lists
      - Maps
      - Trees
      - Searching
      - Sorting
      - Complexity
- id: computer-systems
  title: Computer Systems
  order: 1
  path: 01-computer-systems/README.md
  purpose: Understand how hardware executes programs and where resource limits arise.
  prerequisites:
  - computer-fundamentals
  subjects:
  - id: hardware-subject
    title: Hardware and Execution
    order: 1
    topics:
    - id: computer-architecture
      title: Computer Architecture
      order: 1
      prerequisites:
      - computer-fundamentals
      concepts:
      - CPU
      - Instruction execution
      - Caches
      - Memory
      - Storage
      - I/O
    - id: systems-performance
      title: Systems Performance
      order: 2
      prerequisites:
      - computer-architecture
      concepts:
      - Locality
      - CPU bottlenecks
      - Memory bandwidth
      - Storage latency
- id: operating-systems
  title: Operating Systems
  order: 2
  path: 02-operating-systems/README.md
  purpose: Understand resource isolation, scheduling, and the interfaces between programs
    and hardware.
  prerequisites:
