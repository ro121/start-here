      title: Proxies and Load Balancing
      order: 1
      prerequisites:
      - http
      - tls
      concepts:
      - Forward proxy
      - Reverse proxy
      - L4 and L7 balancing
      - Health checks
    - id: network-troubleshooting
      title: Network Troubleshooting
      order: 2
      prerequisites:
      - routing
      - dns
      - tls
      - network-security
      concepts:
      - Layered diagnosis
      - Packet capture
      - DNS failures
      - Connection timeouts
