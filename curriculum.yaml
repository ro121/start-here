      title: Linux Processes
      order: 1
      prerequisites:
      - processes-threads
      - linux-shell
      concepts:
      - Process inspection
      - Threads
      - Signals
      - File descriptors
      - /proc
    - id: linux-services
      title: Linux Services
      order: 2
      prerequisites:
      - linux-processes
      concepts:
      - systemd
      - Units
      - Service lifecycle
      - Dependencies
      - Journal logs
      implements:
      - desired-state
    - id: linux-networking
      title: Linux Networking
      order: 3
      prerequisites:
      - linux-shell
      - routing
      - dns
      - tcp
      concepts:
      - Interfaces
      - Routes
      - Sockets
      - Resolver configuration
      - DNS resolution
      - SSH
    - id: linux-troubleshooting
      title: Linux Troubleshooting
      order: 4
      prerequisites:
      - linux-services
      - linux-networking
      - memory-management
      concepts:
