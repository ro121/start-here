      - CPU saturation
      - Memory pressure
      - Disk exhaustion
      - Socket inspection
- id: networking
  title: Networking
  order: 4
  path: 04-networking/README.md
  purpose: Understand communication from local links through application protocols
    and traffic management.
  prerequisites:
  - computer-fundamentals
  subjects:
  - id: network-models-subject
    title: Models and Local Links
    order: 1
    topics:
    - id: osi-model
      title: OSI Model
      order: 1
      prerequisites:
      - computer-fundamentals
      concepts:
      - Layers
      - Encapsulation
      - Model limitations
    - id: tcp-ip
      title: TCP-IP Model
      order: 2
      prerequisites:
      - osi-model
      concepts:
      - Link layer
      - Internet layer
      - Transport layer
      - Application layer
    - id: ethernet
      title: Ethernet
      order: 3
      prerequisites:
      - tcp-ip
      concepts:
      - Frames
      - MAC addresses
      - Switching
      - ARP
  - id: network-addressing-subject
    title: Addressing and Routing
    order: 2
    topics:
